[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "contingency-procedure2dsl"
dynamic = ["version"]
description = "Extract contingency-dsl AST from academic paper Method sections (JEAB/JABA)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
# The round-trip tests compile the extracted AST back to prose.
test = ["pytest>=8", "pytest-cov", "contingency-dsl2procedure>=0.1.1,<0.2"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/contingency_procedure2dsl/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/contingency_procedure2dsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
